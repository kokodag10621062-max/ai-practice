<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>미로찾기</title>
<style>
  :root {
    --bg: #f4f1ea; --panel: #fffdf8; --text: #2b2a28; --muted: #7a756c;
    --wall: #2b2a28; --floor: #fffdf8; --goal: #2f9e6e;
    --trail: rgba(224, 86, 59, 0.18); --btn: #ece6da; --btn-hover: #e2dacb;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1b1c1f; --panel: #24262a; --text: #ecebe8; --muted: #9a978f;
      --wall: #d9d6cf; --floor: #24262a; --goal: #4cc790;
      --trail: rgba(255, 122, 92, 0.2); --btn: #2f3237; --btn-hover: #3a3d43;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; overscroll-behavior: none; }
  body {
    background: var(--bg); color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", "Malgun Gothic", sans-serif;
    display: flex; flex-direction: column; align-items: center;
    height: 100vh; height: 100dvh;
    padding: max(12px, env(safe-area-inset-top)) 12px max(12px, env(safe-area-inset-bottom));
    gap: 10px; touch-action: none; user-select: none; -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  h1 { margin: 0; font-size: 1.4rem; letter-spacing: -0.02em; }
  .hud { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; align-items: center; }
  .stat {
    background: var(--panel); border-radius: 10px; padding: 6px 12px;
    font-variant-numeric: tabular-nums; font-size: 0.95rem;
  }
  .stat b { font-weight: 600; }
  .stat span { color: var(--muted); margin-right: 4px; }
  button {
    font: inherit; color: var(--text); background: var(--btn); border: none;
    border-radius: 10px; padding: 6px 14px; cursor: pointer;
  }
  button:hover { background: var(--btn-hover); }
  select {
    font: inherit; color: var(--text); background: var(--btn); border: none;
    border-radius: 10px; padding: 6px 10px;
  }
  .board {
    position: relative; flex: 1; min-height: 0; width: 100%;
    display: flex; align-items: center; justify-content: center;
  }
  .wrap { position: relative; }
  canvas { display: block; }
  .overlay {
    position: absolute; inset: 12%; display: none; flex-direction: column;
    align-items: center; justify-content: center; gap: 10px; border-radius: 50%;
    background: color-mix(in srgb, var(--bg) 92%, transparent); text-align: center; padding: 16px;
  }
  .overlay.show { display: flex; }
  .overlay h2 { margin: 0; font-size: 1.5rem; }
  .overlay p { margin: 0; color: var(--muted); }
  .pad {
    display: grid; grid-template-columns: repeat(3, 56px); grid-template-rows: repeat(2, 56px);
    gap: 6px;
  }
  .pad button { font-size: 1.3rem; padding: 0; }
  .pad .up { grid-column: 2; }
  .pad .left { grid-column: 1; grid-row: 2; }
  .pad .down { grid-column: 2; grid-row: 2; }
  .pad .right { grid-column: 3; grid-row: 2; }
  .hint { color: var(--muted); font-size: 0.85rem; margin: 0; text-align: center; }
  @media (hover: hover) and (pointer: fine) { .pad { display: none; } }
</style>
</head>
<body>
  <h1>미로찾기</h1>
  <div class="hud">
    <div class="stat"><span>레벨</span><b id="level">1</b></div>
    <div class="stat"><span>시간</span><b id="time">0.0</b>초</div>
    <div class="stat"><span>이동</span><b id="moves">0</b></div>
    <select id="size" aria-label="난이도">
      <option value="5">쉬움</option>
      <option value="8" selected>보통</option>
      <option value="12">어려움</option>
    </select>
    <button id="newBtn">새 미로</button>
  </div>
  <div class="board" id="board">
    <div class="wrap">
      <canvas id="c"></canvas>
      <div class="overlay" id="win">
        <div style="font-size:2.6rem">🎉</div>
        <h2 id="winTitle">축하해요! 탈출 성공!</h2>
        <p id="winMsg"></p>
        <p id="bestMsg"></p>
        <button id="nextBtn">다음 레벨</button>
      </div>
    </div>
  </div>
  <div class="pad">
    <button class="up" data-d="up" aria-label="위">▲</button>
    <button class="left" data-d="left" aria-label="왼쪽">◀</button>
    <button class="down" data-d="down" aria-label="아래">▼</button>
    <button class="right" data-d="right" aria-label="오른쪽">▶</button>
  </div>
  <p class="hint">가운데에서 출발해 바깥 초록 출구로! · 방향키 / WASD · 휴대폰은 스와이프, 가고 싶은 쪽 탭, 또는 버튼 · R: 새 미로</p>

<script>
(() => {
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  const $ = id => document.getElementById(id);
  const TAU = Math.PI * 2, A0 = -Math.PI / 2; // 12시 방향부터 시작
  const KEYVEC = { up: [0, -1], right: [1, 0], down: [0, 1], left: [-1, 0] };
  const ANIMALS = ['🐶', '🐱', '🐰', '🐻', '🐼', '🦊', '🐯', '🦁', '🐨', '🐹', '🐸', '🐷'];

  // 원형 미로 상태
  // 고리 r=0은 가운데 한 칸, 바깥 고리로 갈수록 칸 수가 늘어남(칸이 너무 넓어지면 2배로 분할)
  let R, counts, offs, links, player, goal, trail, moves, startTime, timerId, won;
  let level = 1, animal = ANIMALS[0], size, C, ringH;

  const id = (r, c) => offs[r] + c;

  function buildRings(rings) {
    counts = [1, 6];
    for (let r = 2; r < rings; r++) {
      const prev = counts[r - 1];
      const ratio = (TAU * (r + 0.5)) / prev; // 칸 하나의 호 길이 / 고리 두께
      counts.push(ratio >= 2 ? prev * 2 : prev);
    }
    offs = []; let t = 0;
    for (const n of counts) { offs.push(t); t += n; }
    return t;
  }

  function parentOf(r, c) {
    if (r === 1) return [0, 0];
    const f = counts[r] / counts[r - 1];
    return [r - 1, Math.floor(c / f)];
  }
  function childrenOf(r, c) {
    if (r >= R - 1) return [];
    if (r === 0) return Array.from({ length: counts[1] }, (_, i) => [1, i]);
    const f = counts[r + 1] / counts[r], out = [];
    for (let i = 0; i < f; i++) out.push([r + 1, c * f + i]);
    return out;
  }
  function ringNeighbors(r, c) {
    if (r === 0) return [];
    const n = counts[r];
    return [[r, (c + 1) % n], [r, (c - 1 + n) % n]];
  }

  // 미로 생성: 무작위 깊이 우선 탐색 — 매번 새로운 미로
  // 한 칸에서 바깥쪽으로 열리는 길은 최대 1개로 제한 → 각 칸의 출구가 안/밖/시계/반시계 4방향이라 조작이 직관적
  function generate() {
    const total = buildRings(R);
    links = Array.from({ length: total }, () => new Set());
    const seen = new Uint8Array(total), outUsed = new Uint8Array(total);
    const stack = [[0, 0]]; seen[0] = 1;
    while (stack.length) {
      const [r, c] = stack[stack.length - 1];
      const me = id(r, c), opts = [];
      for (const [nr, nc] of ringNeighbors(r, c)) if (!seen[id(nr, nc)]) opts.push([nr, nc]);
      if (!outUsed[me]) for (const [nr, nc] of childrenOf(r, c)) if (!seen[id(nr, nc)]) opts.push([nr, nc]);
      if (r > 0) {
        const [pr, pc] = parentOf(r, c), p = id(pr, pc);
        if (!seen[p] && !outUsed[p]) opts.push([pr, pc]);
      }
      if (!opts.length) { stack.pop(); continue; }
      const [nr, nc] = opts[Math.floor(Math.random() * opts.length)], o = id(nr, nc);
      links[me].add(o); links[o].add(me);
      if (nr > r) outUsed[me] = 1; else if (nr < r) outUsed[o] = 1;
      seen[o] = 1; stack.push([nr, nc]);
    }
  }

  function cellPos(r, c) {
    if (r === 0) return [C, C];
    const a = A0 + (c + 0.5) * TAU / counts[r], rad = (r + 0.5) * ringH;
    return [C + rad * Math.cos(a), C + rad * Math.sin(a)];
  }

  function openNeighbors(r, c) {
    const me = id(r, c), [px, py] = cellPos(r, c), out = [];
    const cand = [...ringNeighbors(r, c), ...childrenOf(r, c)];
    if (r > 0) cand.push(parentOf(r, c));
    for (const [nr, nc] of cand) {
      if (!links[me].has(id(nr, nc))) continue;
      const [qx, qy] = cellPos(nr, nc), dx = qx - px, dy = qy - py, L = Math.hypot(dx, dy) || 1;
      out.push({ r: nr, c: nc, v: [dx / L, dy / L] });
    }
    return out;
  }

  // 방향키 → 열린 길 연결: 4개 키와 열린 길을 가장 자연스럽게 짝지음(모든 길에 키가 하나씩 배정됨)
  function keyMap(r, c) {
    const opens = openNeighbors(r, c), keys = Object.keys(KEYVEC);
    let best = -Infinity, bestMap = {};
    (function rec(i, used, score, map) {
      if (i === keys.length) {
        if (score > best && Object.keys(map).length === opens.length) { best = score; bestMap = { ...map }; }
        return;
      }
      rec(i + 1, used, score, map);
      const [kx, ky] = KEYVEC[keys[i]];
      opens.forEach((o, j) => {
        if (used & (1 << j)) return;
        const cos = kx * o.v[0] + ky * o.v[1];
        if (cos < -0.2) return;
        const m = { ...map }; m[j] = keys[i];
        rec(i + 1, used | (1 << j), score + cos, m);
      });
    })(0, 0, 0, {});
    const res = {};
    for (const j in bestMap) res[bestMap[j]] = opens[j];
    return res;
  }

  function moveTo(t) {
    if (won || !t) return;
    if (startTime === null) {
      startTime = performance.now();
      timerId = setInterval(() => {
        $('time').textContent = ((performance.now() - startTime) / 1000).toFixed(1);
      }, 100);
    }
    player = { r: t.r, c: t.c };
    trail.add(id(t.r, t.c));
    $('moves').textContent = ++moves;
    draw();
    if (player.r === goal.r && player.c === goal.c) finish();
  }
  const moveKey = name => { if (!won) moveTo(keyMap(player.r, player.c)[name]); };
  // 스와이프/탭: 그 방향과 가장 가까운 열린 길로
  function moveVec(dx, dy) {
    if (won) return;
    const L = Math.hypot(dx, dy); if (!L) return;
    let best = null, bc = 0.35;
    for (const o of openNeighbors(player.r, player.c)) {
      const cos = (dx * o.v[0] + dy * o.v[1]) / L;
      if (cos > bc) { bc = cos; best = o; }
    }
    moveTo(best);
  }

  function sizeCanvas() {
    const b = $('board');
    size = Math.max(160, Math.floor(Math.min(b.clientWidth, b.clientHeight)));
    C = size / 2;
    ringH = (size / 2 - 6) / R;
    const dpr = window.devicePixelRatio || 1;
    canvas.style.width = canvas.style.height = size + 'px';
    canvas.width = canvas.height = Math.round(size * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  function newMaze() {
    const base = parseInt($('size').value, 10) + (level - 1);
    const b = $('board');
    const maxRings = Math.max(4, Math.floor(Math.min(b.clientWidth, b.clientHeight) / 2 / 16));
    R = Math.min(base, maxRings, 24);
    generate();
    player = { r: 0, c: 0 };
    goal = { r: R - 1, c: Math.floor(Math.random() * counts[R - 1]) };
    animal = ANIMALS[Math.floor(Math.random() * ANIMALS.length)]; // 새 미로마다 다른 동물
    trail = new Set([0]);
    moves = 0; won = false; startTime = null;
    clearInterval(timerId);
    $('time').textContent = '0.0';
    $('moves').textContent = '0';
    $('level').textContent = level;
    $('win').classList.remove('show');
    sizeCanvas();
    draw();
  }

  function css(name) { return getComputedStyle(document.documentElement).getPropertyValue(name).trim(); }

  function sector(r, c) {
    ctx.beginPath();
    if (r === 0) { ctx.arc(C, C, ringH, 0, TAU); return; }
    const a0 = A0 + c * TAU / counts[r], a1 = A0 + (c + 1) * TAU / counts[r];
    ctx.arc(C, C, (r + 1) * ringH, a0, a1);
    ctx.arc(C, C, r * ringH, a1, a0, true);
    ctx.closePath();
  }

  function draw() {
    ctx.clearRect(0, 0, size, size);
    // 바닥
    ctx.fillStyle = css('--floor');
    ctx.beginPath(); ctx.arc(C, C, R * ringH, 0, TAU); ctx.fill();
    // 지나온 길
    ctx.fillStyle = css('--trail');
    for (let r = 0; r < R; r++) for (let c = 0; c < counts[r]; c++) {
      if (trail.has(id(r, c))) { sector(r, c); ctx.fill(); }
    }
    // 출구 칸
    ctx.fillStyle = css('--goal');
    ctx.globalAlpha = 0.85; sector(goal.r, goal.c); ctx.fill(); ctx.globalAlpha = 1;

    // 벽
    ctx.strokeStyle = css('--wall');
    ctx.lineWidth = Math.max(2, ringH * 0.12);
    ctx.lineCap = 'round';
    ctx.beginPath();
    for (let r = 1; r < R; r++) {
      const n = counts[r];
      for (let c = 0; c < n; c++) {
        const me = id(r, c);
        const a0 = A0 + c * TAU / n, a1 = A0 + (c + 1) * TAU / n;
        const [pr, pc] = parentOf(r, c);
        if (!links[me].has(id(pr, pc))) {           // 안쪽 벽(호)
          ctx.moveTo(C + r * ringH * Math.cos(a0), C + r * ringH * Math.sin(a0));
          ctx.arc(C, C, r * ringH, a0, a1);
        }
        if (!links[me].has(id(r, (c - 1 + n) % n))) { // 반시계 쪽 벽(방사선)
          ctx.moveTo(C + r * ringH * Math.cos(a0), C + r * ringH * Math.sin(a0));
          ctx.lineTo(C + (r + 1) * ringH * Math.cos(a0), C + (r + 1) * ringH * Math.sin(a0));
        }
      }
    }
    // 바깥 테두리(출구 칸만 열림)
    const n = counts[R - 1], g0 = A0 + (goal.c + 1) * TAU / n, g1 = A0 + goal.c * TAU / n + TAU;
    const RR = R * ringH;
    ctx.moveTo(C + RR * Math.cos(g0), C + RR * Math.sin(g0));
    ctx.arc(C, C, RR, g0, g1);
    ctx.stroke();

    // 플레이어(동물 머리)
    const [x, y] = cellPos(player.r, player.c);
    ctx.font = `${Math.floor(ringH * 0.8)}px "Segoe UI Emoji", "Apple Color Emoji", "Noto Color Emoji", sans-serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(animal, x, y + ringH * 0.04);
  }

  function finish() {
    won = true;
    clearInterval(timerId);
    const t = ((performance.now() - startTime) / 1000).toFixed(1);
    $('time').textContent = t;
    const cheers = ['축하해요! 탈출 성공!', '대단해요! 미로 정복!', '훌륭해요! 출구 도착!', '멋져요! 길을 찾았어요!'];
    $('winTitle').textContent = cheers[Math.floor(Math.random() * cheers.length)];
    $('winMsg').textContent = `걸린 시간 ${t}초 · ${moves}번 이동`;
    const key = `maze-round-best-${$('size').value}-${level}`;
    let best = null;
    try { best = parseFloat(localStorage.getItem(key)); } catch (e) {}
    if (!best || parseFloat(t) < best) {
      try { localStorage.setItem(key, t); } catch (e) {}
      $('bestMsg').textContent = best ? `🏆 새 최고 기록! (이전 ${best}초)` : '';
    } else {
      $('bestMsg').textContent = `최고 기록 ${best}초`;
    }
    $('win').classList.add('show');
    $('nextBtn').focus();
  }

  const KEYS = {
    ArrowUp: 'up', ArrowDown: 'down', ArrowLeft: 'left', ArrowRight: 'right',
    w: 'up', s: 'down', a: 'left', d: 'right', W: 'up', S: 'down', A: 'left', D: 'right',
  };
  window.addEventListener('keydown', e => {
    if (KEYS[e.key]) { e.preventDefault(); moveKey(KEYS[e.key]); }
    else if (e.key === 'r' || e.key === 'R') newMaze();
    else if (e.key === 'Enter' && won) { level++; newMaze(); }
  });

  // 스와이프 / 탭
  let touch = null;
  canvas.addEventListener('touchstart', e => { const t = e.touches[0]; touch = { x: t.clientX, y: t.clientY }; }, { passive: true });
  canvas.addEventListener('touchend', e => {
    if (!touch) return;
    const t = e.changedTouches[0], dx = t.clientX - touch.x, dy = t.clientY - touch.y;
    touch = null;
    e.preventDefault();
    if (Math.max(Math.abs(dx), Math.abs(dy)) >= 20) { moveVec(dx, dy); return; }
    // 탭: 동물 머리에서 탭한 지점 쪽으로 한 칸
    const r = canvas.getBoundingClientRect(), [px, py] = cellPos(player.r, player.c);
    const tx = t.clientX - r.left - px, ty = t.clientY - r.top - py;
    if (Math.hypot(tx, ty) > ringH * 0.4) moveVec(tx, ty);
  });

  // 버튼 길게 누르면 연속 이동
  document.querySelectorAll('.pad button').forEach(b => {
    let rep;
    const stop = () => clearInterval(rep);
    b.addEventListener('pointerdown', e => {
      e.preventDefault(); moveKey(b.dataset.d);
      rep = setInterval(() => moveKey(b.dataset.d), 160);
    });
    ['pointerup', 'pointerleave', 'pointercancel'].forEach(ev => b.addEventListener(ev, stop));
  });

  $('newBtn').addEventListener('click', () => { newMaze(); $('newBtn').blur(); });
  $('nextBtn').addEventListener('click', () => { level++; newMaze(); });
  $('size').addEventListener('change', () => { level = 1; newMaze(); $('size').blur(); });
  let resizeTimer;
  window.addEventListener('resize', () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(() => {
      if (moves === 0 && !won) newMaze(); else { sizeCanvas(); draw(); }
    }, 120);
  });
  matchMedia('(prefers-color-scheme: dark)').addEventListener('change', draw);

  // 페이지를 열 때마다 새로운 미로 자동 생성 (레이아웃이 잡힌 뒤 크기를 재서 화면에 맞게)
  newMaze();
  requestAnimationFrame(() => { if (moves === 0) newMaze(); });
})();
</script>
</body>
</html>
